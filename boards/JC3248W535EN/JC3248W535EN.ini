[env:JC3248W535EN]
board = JC3248W535EN
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 921600
build_src_filter = ${env.build_src_filter} +<../boards/JC3248W535EN> -<../boards/JC3248W535EN/jc3248w535en_dma.cpp>
build_flags =
    ${env.build_flags}
    -Iboards/JC3248W535EN
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDEEPSLEEP_WAKEUP_PIN=-1
    -DDEEPSLEEP_PIN_ACT=LOW
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@^1.5.5
